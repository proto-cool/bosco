[project]
name = "bosco"
version = "2.0.0a0"
description = "A fruit fly's brain (MaleCNS v1.0) as a decision model."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=17",
    "numpy>=2",
    "pandas>=2.2",
    "neuprint-python>=0.4",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# gate B: the frozen encoder and the logistic baseline (docs/GATE-B.md)
gate = ["sentence-transformers>=3", "scikit-learn>=1.5", "datasets>=3", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bosco"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # frozen-dataclass defaults in signatures are intentional

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "B023"]  # scan/report scripts print wide tables; per-gain closures are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
