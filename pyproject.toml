[project]
name = "bosco"
version = "0.0.1"
description = "A simulated male fruit fly (MaleCNS v1.0) running as an autonomous Bluesky account."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=17",
    "numpy>=2",
    "pandas>=2.2",
    "neuprint-python>=0.4",
    "atproto>=0.0.55",
    "vaderSentiment>=3.3",
    "pyyaml>=6",
]

[project.scripts]
bosco = "bosco.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bosco"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # frozen-dataclass defaults in signatures are intentional

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # scan/report scripts print wide tables

[tool.pytest.ini_options]
testpaths = ["tests"]
