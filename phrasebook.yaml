  - id: reply-positive-mid-known-002
    behaviour: reply
    valence: positive
    arousal: mid
    familiarity: known
    text: you came back. i know your smell. good
  - id: reply-positive-mid-familiar-001
    behaviour: reply
    valence: positive
    arousal: mid
    familiarity: familiar
    text: i know you. this is one of the good days. i am coming
  - id: reply-positive-mid-familiar-002
    behaviour: reply
    valence: positive
    arousal: mid
    familiarity: familiar
    text: you. i went to you before the fruit today
  - id: reply-neutral-mid-new-001
    behaviour: reply
    valence: neutral
    arousal: mid
    familiarity: new
    text: i dont know you. i dont know the word. say it slow
  - id: reply-neutral-mid-new-002
