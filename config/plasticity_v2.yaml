# PROPOSED AND REFUSED, BOTH OF THEM.  Nothing loads this file: he runs plasticity_v1.yaml.
#
# Two attempts at the one-way ratchet (docs/plasticity-v2.md), kept disabled with their tests.
# `homeostasis` overshot: replayed from his live weights it took every one of 33 accounts below
# zero (mean -0.345), which is the mirror of the bug rather than a fix -- it moves the common
# mode, and a verdict is a difference of two means.  Both runs agreed on the real defect: sour
# accounts and sweet accounts come out the same under every rule (+0.107 against +0.111), so the
# verdict carries almost nothing about who.  That is the encoder's business, not the rule's.
#
# `extinction` was the first attempt and is OFF (eta 0).  It was refused by its own gate:
# replayed from his live weights it raised his verdicts (+0.310 -> +0.392, against +0.345 for
# v1) instead of levelling them, because on a diet that is mostly sweet the compartment it keeps
# relaxing is the punishment one, and a verdict is reward-side depression minus punishment-side.
# It is kept at zero because the mechanism is sound and the gate is worth keeping runnable.
#
# Mushroom-body plasticity parameters (see src/bosco/plasticity.py).
#
# Two timescales, both KC->MBON depression gated by DAN compartment:
#   short-term (STM): one pairing is enough; relaxes to baseline, e-fold tau_stm_h.
#   long-term  (LTM): forms only by spaced repetition (a pairing on a synapse that
#                     already carries STM from a pairing >= spacing_h earlier);
#                     relaxes to baseline, e-fold tau_ltm_d.  (Tully et al. 1994:
#                     spaced training -> protein-synthesis-dependent LTM.)
stm:
  eta: 0.5            # depression per pairing for a saturating KC
  c_sat: 3.0          # KC spikes/s at which depression saturates (3 under adaptation; was 5)
  m_min: 0.1
  tau_h: 4.0
ltm:
  eta: 0.3            # LTM depression per consolidating pairing
  spacing_h: 1.0      # minimum gap since the previous pairing on that synapse
  stm_floor: 0.9      # the synapse must still carry STM (m_stm below this)
  m_min: 0.2
  tau_d: 30.0
# Taste while browsing (decided 2026-09-15).  In the fly, sugar sensory neurons drive the PAM
# reward DANs and bitter ones the PPL1 punishment DANs; that is how odor-taste conditioning
# works at all.  So the taste of a post he reads (VADER -> sugar/bitter GRNs, config/encoder_v1.yaml
# `gustatory`) pairs the mixture in that window (account, place, topics, words) with reward or
# punishment, at strength = gain x the gustatory rate fraction min(1, |c| / c_sat).  A labeled post
# (bitter at full rate, EXPERIMENT.md 2b) pairs punishment at labeled_gain.  Small, so a day of
# reading moves a verdict a little; spaced repetition consolidates it like any pairing.  Not a
# social reward: no appetite bite, no outcomes row; the episode row carries the weight digests and
# a `taste:` note.  Never set from outcomes.
taste:
  reward_gain: 0.15
  punishment_gain: 0.1
  labeled_gain: 0.3
# Exposure (decided 2026-09-15): the novelty compartment a'3 (config/mb_compartments.yaml
# `exposure`).  Every stimulus window depresses the a'3 synapses of the KCs that fired, on its own
# multiplier with its own decay, so the same smell later drives MBON-a'3 less: that depression,
# read on the active KCs, is his familiarity with the smell (0 novel .. 1 well met).  tau_h about
# a day, so "today" is familiar and last week is not.  Hattori et al. 2017.
exposure:
  eta: 0.3
  c_sat: 3.0
  m_min: 0.3
  tau_h: 24.0
# Extinction (decided 2026-09-18).  Depression in v1 was one-way: only the clock relieved it.
# Under a diet that is 2.7:1 sweet to bitter, the reward compartments therefore accumulated
# depression across the whole Kenyon cell population, every odor inherited the same positive
# offset (mean verdict +0.259 at freeze-v1, +0.332 a day later, spread narrowing), and no account
# could ever read bitter.  In the fly, forgetting is active and dopamine-driven rather than
# passive (Berry et al. 2012, 2015), re-exposure without reinforcement updates a memory
# (Felsenberg et al. 2018), and KC->MBON plasticity is bidirectional with its sign set by the
# pairing (Cohn et al. 2015; Aso & Rubin 2016; Handler et al. 2019).  So: a compartment whose
# DANs did not fire while its KCs did relaxes towards baseline by eta x the same rate fraction
# the depression rule uses, and LTM relaxes at eta x (ltm.eta / stm.eta) -- slower, by the ratio
# already in this file, so consolidated memory gives way last and no new number is invented.
#
# eta is set from the behavioural protocol, not from his feed and never from outcomes: a handful
# of unreinforced presentations should visibly relax a fresh memory, as two one-minute
# re-exposures do in Felsenberg et al. 2018.  At 0.1 each full-strength unpaired presentation
# closes a tenth of the remaining gap, so seven of them halve it.  scripts/plasticity_v2_gate.py
# replays his logged stimulus stream under v1 and v2 and prints what it did to him.
extinction:
  eta: 0.0  # refused; see the header and docs/plasticity-v2.md

# Homeostasis (2026-09-18).  The fault extinction failed to fix: depression is one-way, so the
# level a compartment sits at is the running total of everything he has ever tasted.  His feed is
# 2.7:1 sweet, so the reward compartments sink for every odor alike; the difference the readout
# takes inherits that as a standing offset which grows (+0.259 at freeze-v1, +0.332 a day later),
# and no account can come out bitter however sour its posts -- 40 probed on his live weights ran
# +0.218 to +0.423 with nothing below zero.
#
# Each compartment scales itself back towards the mean drive it started with: homeostatic
# synaptic scaling (Turrigiano & Nelson 2004; Davis 2013 for Drosophila).  One number per
# compartment, uniform inside it, so it cannot touch what he has learned about one smell against
# another -- it moves the level, not the pattern, and what an odor has learned is then measured
# against its compartment rather than against nothing.
#
# The mean is weighted by how much each Kenyon cell has actually been firing, because drive is
# what a neuron scales itself to and a synapse whose cell never fires contributes none of it:
# only 608 of his 4,064 KCs carry any of his traffic, and a flat average over the silent ones
# said the compartments had barely moved (gain 1.14) while the cells doing the work had halved.
#
# tau_h is set by a separation of timescales and never from his feed: slower than short-term
# memory (4 h), so a fresh memory is not scaled away before he can use it, and far faster than
# long-term memory (30 days), so drift cannot accumulate.  It is also the window the activity
# average uses, so the scaling and what it measures move together.  max is a rail rather than a
# knob -- it should not bind, and the gate prints the gains so that it is visible when it does --
# and it matters because scaling up strengthens KC->MBON synapses above baseline while his
# readout thresholds are frozen.
homeostasis:
  tau_h: 0.0  # refused; 12.0 was the value tried, see the header and docs/plasticity-v2.md
  max: 4.0

# Credit confinement (2026-09-18).  What extinction and homeostasis both missed: the defect is
# not the sign of the rule or the balance of the compartments, it is that an account's verdict is
# almost entirely other people's posts.
#
# The verdict is probed on the account odor alone (Agent.account_signature), while a pairing
# lands on the whole mixture the account arrived in -- its words, its topics, the feed, the
# pictures.  Measured on his live weights (scripts/kc_overlap.py, 12 accounts, his own logged
# windows): 88% of an account's probe cells fire in that account's own windows, and 47% of them
# fire in any other window as well.  Over 6,199 logged windows that leaves an account with 23
# reads responsible for roughly 0.7% of the depression its own verdict is read from.  That is
# the r ~ 0, and no rescaling of a quantity that is 99.3% background can put information into it.
#
# So: a pairing about an account teaches only the cells that account's odor owns.  Probed on the
# odor alone, taught on the odor alone.  The cost is that a window no longer teaches the whole
# mixture -- what he learns about a topic or a feed comes only through the windows where it is
# the thing being judged -- and that is the trade this is making deliberately.
#
# This is a behaviour change after freeze-v1: it needs its own tag and an EXPERIMENT.md 2d note.
# scripts/credit_gate.py replays his real logged windows under both rules and probes every
# account; the requirement it has to pass is that a net-bitter account reads below zero and a
# net-sweet one above it.
# mode:
#   mixture -- v1: the window teaches every cell it lit
#   own     -- the cells the account's odor owns, flat
#   share   -- those cells weighted by 1 / (accounts whose odor lights the cell): a cell twenty
#              accounts drive is nobody's, so it neither learns much about one of them nor
#              reports much about one of them.  `contrast` then reads the verdict against the
#              compartment's own level instead of against nothing -- the level is shared by every
#              odor, and what is an account's own is how far its cells sit from it.
credit:
  mode: share
  contrast: true
