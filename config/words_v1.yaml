# Words as smells (decided 2026-09-14; frozen at freeze-v1).  Every content word in his
# closed vocabulary (the corpus and phrasebook, minus the function words below) is an odor:
# blake2b(word) chooses k neutral glomeruli and a rate in rate_hz, the same way an account
# is an odor.  A post's content words (in his vocabulary, up to max_words in order of first
# appearance) are driven on top of the account odor and the topics.  A word alone reaches a
# few dozen Kenyon cells at these rates; fainter and its memory is all-or-nothing.  He never sees the
# sentence; he smells which of his own words were in it.  The mushroom body then learns,
# per word, what came with it; that memory is read back from the weights (word valence)
# and leans on the generator's choice of words.  A thread lingers: the words of the last
# posts in a thread he is in stay in the air for thread_tau_s and are smelled again, at a
# lower rate, with the next post in that thread (not words smelled within context_fresh_s:
# those afferents are still depressed).  What is "in the air" when he speaks is read from
# his antennae, not from this list: habituation (config/model_v1.yaml, e-fold std_tau_rec)
# leaves every recently smelled word's afferents depressed in proportion to how recently
# and how hard, and that depth, over the words logged for the thread, is the echo.
k: 3
rate_hz: [90.0, 130.0]
max_words: 6
# Perception vocabulary (decided 2026-09-15): a word outside his closed vocabulary is still a smell.
# It is kept only as the first eight bytes of blake2b("word|" + word), written `h:<16 hex>`, and
# those bytes seed its glomeruli and rate exactly as a vocabulary word's hash does, so the same
# word is always the same smell and a vocabulary word and its hash are the same smell.  Up to
# max_hashed such tokens per post, after the vocabulary words.  He can learn to like it, meet it
# again, and associate it with a person; he can never say it: the generator's words are the
# corpus and the phrasebook, and a hashed token is in no sentence of his, so it weighs nothing
# there.  The database holds the hash, never the word (a common word's hash can be brute-forced
# by anyone with a dictionary; the discipline is that no text is stored, not secrecy).
perception:
  max_hashed: 4
context_rate_scale: 0.5     # lingering words are driven at this fraction of their rate
thread_tau_s: 240.0         # a thread's smell lasts this long after its last post (about what his antennae hold)
thread_keep: 3              # the last posts of a thread that linger
context_fresh_s: 60.0       # words smelled this recently are not re-presented; their afferents are still depressed
air_floor: 0.05             # a word whose afferents are depressed less than this is not in the air
min_len: 3
valence_beta: 1.0           # generator: p(word) x (1 + beta * learned valence of the word)
echo_gamma: 2.0             # generator: p(word) x (1 + gamma * depression) for words in the air right now
day_echo: 0.25              # his own posts: the words of his last hours count as this much air
day_hours: 6.0              # how far back "his day" reaches for mood, verdict and smells
stopwords:
  [the, and, but, for, nor, yet, are, was, were, been, being, have, has, had, having, does,
   did, doing, will, would, shall, should, can, could, may, might, must, not, this, that,
   these, those, there, here, then, than, when, where, what, which, who, whom, whose, why,
   how, all, any, each, few, more, most, other, some, such, only, own, same, too, very, just,
   now, out, off, over, under, again, further, once, into, onto, from, with, about, above,
   below, between, through, during, before, after, because, while, until, both, either,
   neither, also, ever, never, always, still, you, your, yours, they, them, their, theirs,
   she, her, hers, him, his, its, our, ours, one, ones, thing, things, something, someone,
   anything, nothing, everything, get, got, put, let, say, said, says, see, saw, know, knew,
   think, thought, want, wanted, like, likes, liked, make, made, come, came, went, going,
   goes, dont, cant, wont, didnt, isnt, doesnt, okay, yes, yeah, maybe, sure, ok]
