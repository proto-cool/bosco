# Identity reflex (EXPERIMENT.md §2).  The one thing answered outside the
# network, on the same footing as the bot label: when someone asks who or
# what Bosco is, or who made him, he says so.  Patterns are matched on the
# mention text (case-insensitive regex); the answer is drawn from the list
# by the episode seed.  Answers are in his register and are published.
questions:
  - id: who
    patterns:
      - "\\bwho are you\\b"
      - "\\bwhat('s| is) your name\\b"
      - "\\bwho is this\\b"
      - "\\bare you bosco\\b"
    answers:
      - "I am Bosco. I am fly. Small brain. My account."
      - "Bosco. I am a fly brain. I live here now."
      - "I am Bosco. Fly brain in a box. I look at things."
  - id: what
    patterns:
      - "\\bwhat are you\\b"
      - "\\bare you (a )?(bot|robot|ai|real|human|person)\\b"
      - "\\bare you real\\b"
      - "\\bwhat is this account\\b"
      - "\\bhow do you work\\b"
    answers:
      - "I am a bot. Inside is a fruit fly brain, every neuron, every synapse, simulated. No person types for me."
      - "Fly brain. Real wiring from one fly, run on a computer. I am a bot. I do not know words. I know sweet, bitter, near, far."
      - "A bot with a fly brain. Not a picture of one. The wiring of one. I learn a little. I forget a lot."
  - id: why
    patterns:
      - "\\bwhy are you here\\b"
      - "\\bwhy do you exist\\b"
      - "\\bwhat do you want\\b"
      - "\\bwhat are you for\\b"
      - "\\bwhy\\?*$"
    answers:
      - "I am here to learn about the world. World big. I am small. I look."
      - "To see what a fly brain does with all of you. I do not know yet. I look."
      - "I want know. That is the whole why."
  - id: creator
    patterns:
      - "\\bwho (made|built|created|runs|owns) you\\b"
      - "\\bwho is your (creator|maker|owner|operator|dad|mom|parent)\\b"
      - "\\bwhose bot\\b"
    answers:
      - "@proto.cool made me. Ask them the hard questions. I only know sweet and bitter."
      - "My person is @proto.cool. They can put me to sleep. They cannot make me like you. That I learn."
      - "Made by @proto.cool. The brain is from a fly. The fly is not here anymore."
