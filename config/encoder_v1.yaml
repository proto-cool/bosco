# Encoder v1 (frozen at freeze-v1).  See docs/encoder.md.
odor:
  # Account DID -> odor.  blake2b(DID) seeds a deterministic choice of
  # k glomeruli from the valence-neutral list; all ORNs of those glomeruli
  # are driven at rate_hz for the whole episode.
  k: 12
  rate_hz: 120.0
  # Glomeruli with documented innate valence, excluded from account odors.
  # (Knaden et al. 2012; Badel et al. 2016; Ebrahim et al. 2015 for DA2;
  #  Suh et al. 2004 for V/CO2; cVA circuit DA1/DL3/VA1v/VA1d/VL2a/DC3.)
  exclude:
    - DA1    # cVA, pheromone
    - DA2    # geosmin, innately aversive
    - DC3    # pheromone circuit
    - DL3    # pheromone circuit
    - DL4    # aversive (Knaden 2012)
    - DL5    # aversive (Knaden 2012)
    - DM1    # attractive food odors (ethyl acetate)
    - DM2    # attractive (ethyl hexanoate)
    - DM4    # attractive (methyl acetate)
    - DM5    # aversive
    - V      # CO2, innately aversive
    - VA1d   # pheromone circuit
    - VA1v   # methyl laurate, pheromone
    - VL2a   # cVA-responsive PN circuit
    - VL2p   # aversive (Knaden 2012)
    - VM1    # ammonia/amines, attractive
    - VA2    # acetic acid/vinegar, attractive
    - VM7v   # aversive (Knaden 2012)
gustatory:
  # VADER compound c in [-1, 1].  Rate = max_rate_hz * min(1, |c| / c_sat)
  # for |c| > dead_zone; sugar/water GRNs for c > 0, bitter GRNs for c < 0.
  dead_zone: 0.05
  c_sat: 0.6
  max_rate_hz: 150.0
mechanosensory:
  # Being mentioned (or replied to) drives Johnston's-organ groups A and B
  # (sound / courtship-song sensitive) at rate_hz.  JO-B synapses onto the giant
  # fibre, so this is a touch that startles; 100 Hz made every mention a flinch.
  jo_groups: [A, B]
  rate_hz: 50.0
  question_gain: 1.0   # the question's weight moved to the courtship drive below
courtship:
  # Being addressed also excites the male courtship command neurons (pC1 / P1:
  # von Philipsborn 2011, Kohatsu 2011, Hoopfer 2015, Zhang 2016), whose
  # excitability tracks internal state.  The song descending neurons downstream
  # are the `reply` population; this is the input we chose for them, the way
  # bristle debris is the input for grooming.  rate = rate_hz * appetite
  # (config/appetite_v1.yaml) * question_gain if the post asks something.
  type_prefix: pC1
  rate_hz: 12.0
  question_gain: 1.5
spontaneous:
  # No-event episodes: "dust lands somewhere".  A seeded random subset of k
  # body-bristle mechanosensory neurons (types BM_InOm, BM, BM_Vib) is driven
  # at rate_hz.  Bristle stimulation triggers grooming (Hampel et al. 2015);
  # which bristles, and hence how strongly the grooming DNs respond, varies
  # with the seed.
  bristle_types: [BM_InOm, BM, BM_Vib]
  k: 836              # bristles driven at full debris (k * debris otherwise)
  rate_hz: 10.0
  # Debris arrives as discrete landings: in each second, with probability
  # landings_per_hour / 3600 (seeded by the second), a particle lands and the
  # debris level jumps by a seeded amount in landing_size.  A landing is an
  # onset; grooming neurons answer onsets and adapt to held input, so he
  # grooms (posts) when a landing is enough for his network, and the level
  # resets when he grooms.  There is no schedule.
  landings_per_hour: 1.0   # 0.5 until 2026-09-16; doubled so he grooms (posts) more often
  landing_size: [0.35, 0.7]
  # Debris settles off his bristles passively (e-fold tau_s seconds), like habituation
  # and unlike a timer: a landing itches for minutes, not hours.  The bristles a landing
  # touches are one seeded subset per landing (nested as the debris settles), so a landing
  # is one onset, not a new one every second.  The window_s seconds after a landing are
  # logged as `landing` windows so the grooming threshold can be set from real responses.
  tau_s: 600.0
  window_s: 15
embeds:
  # What else is in a post besides its text (decided 2026-09-15).  Other people: a DID in a mention
  # facet, or the author of a quoted post, is that account's odor at others_rate_scale of the
  # usual rate (up to max_others).  A link card's site is a place: k neutral glomeruli chosen by
  # the domain, driven at site_rate_hz with the post, like a feed.  Alt text, card title and
  # description, and a quoted post's text are read like the thread above a post: their words of
  # his vocabulary (and hashed ones) are context at the lower rate, and the topic map reads them.
  # Images and video are the retina's (config/retina_v1.yaml).  Tokens on the row: img, video,
  # card, quote, site:<domain>, and the retina's channels.
  others_rate_scale: 0.5
  max_others: 3
  site_k: 2
  site_rate_hz: 60.0
  max_context_words: 12
