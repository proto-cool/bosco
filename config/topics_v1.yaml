# Topics as smells (v1.1).  A hand-authored keyword map, published.  Each topic
# is a mixture of k glomeruli drawn (seeded by the topic name) from the same
# valence-neutral set accounts use, driven at rate_hz on top of the account
# odor.  Keywords are matched as whole words, case-insensitive, on the post
# text, which is then discarded; only the topic names are logged.
