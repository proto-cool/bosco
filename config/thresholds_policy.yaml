# Threshold calibration policy (pre-registered; frozen at freeze-v1).
# scripts/calibrate_thresholds.py sets each population's threshold to a quantile of its
# rate over a named set of real windows.  Never outcomes, never hand-set.
#   event         every event window (a post he read)
#   mentioned     event windows in which he was addressed (mention, reply, quote)
#   landing_peak  the peak groom rate in the window after each landing (landing + spontaneous rows
#                 sharing one `landing:<id>` note): one number per landing
min_hz: 1.0
populations:
  engage: {q: 0.85, over: event}
  like:   {q: 0.85, over: event}
  leave:  {q: 0.85, over: event}
  reply:  {q: 0.40, over: mentioned}      # song-DN rate when he is addressed; ~6 in 10 mentions may answer before gating
  groom:  {q: 0.70, over: landing_peak}   # ~3 landings in 10 are enough to groom
  # walk (decided 2026-09-15): a lower rung on the walking population while browsing.  Between
  # this and engage's own threshold he walks toward the source (reads more of the account)
  # instead of following.  About 4 posts in 10 would be walks before gating and caps.
  walk:   {q: 0.60, over: event, population: engage}
# mentioned: was 60; lowered 2026-09-14 with 17 real windows in hand, so the song's threshold
# is his own activity, not the synthetic battery's.  The quantile is unchanged.
min_rows: {event: 200, mentioned: 15, landing_peak: 30}

# KC sparseness (EXPERIMENT.md 5), pre-registered with the thresholds and frozen with them.
# The check is on the distribution, not on each window: 436 of the dev period's 5282 event
# windows had no KC active at all (2026-09-17), so a per-window floor called his ordinary
# silence a fault, and a floor of zero -- which is what the quantile gives -- could never notice
# a mushroom body that had gone quiet for good.  What says he is alive is where the middle of
# the day sits.  The band is wide because the median is allowed to move as he learns and
# habituates; it is there to catch a dead fly and a smouldering one, not to hold him still.
kc_sparseness:
  over: event
  statistic: median
  window_hours: 24        # the night's windows, not the whole history: a death shows up at once
  band: [0.4, 2.5]        # of the dev-period median, written by the calibration as kc_band
  min_rows: 200           # a thin night (he was off, or the box was) is reported, never failed
